<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meridian University - Result Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-blue-600 via-purple-600 to-indigo-800 min-h-screen">
    <!-- Main Container -->
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="bg-white/90 backdrop-blur-lg rounded-2xl shadow-xl p-8 mb-8 text-center">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Meridian University</h1>
            <p class="text-gray-600 text-lg">Student Result Management Portal</p>
        </header>

        <!-- Home Page -->
        <div id="homePage" class="bg-white/90 backdrop-blur-lg rounded-2xl shadow-xl p-8">
            <h2 class="text-3xl font-bold text-center mb-8 text-gray-800">Select Your Role</h2>
            <div class="flex flex-wrap justify-center gap-6">
                <button onclick="showLogin('student')" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl font-semibold text-lg transition-all duration-300 transform hover:scale-105 shadow-lg">
                    Student
                </button>
                <button onclick="showLogin('teacher')" class="bg-green-600 hover:bg-green-700 text-white px-8 py-4 rounded-xl font-semibold text-lg transition-all duration-300 transform hover:scale-105 shadow-lg">
                    Teacher
                </button>
                <button onclick="showLogin('admin')" class="bg-red-600 hover:bg-red-700 text-white px-8 py-4 rounded-xl font-semibold text-lg transition-all duration-300 transform hover:scale-105 shadow-lg">
                    Admin
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="hidden bg-white/90 backdrop-blur-lg rounded-2xl shadow-xl p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 id="loginTitle" class="text-2xl font-bold text-gray-800"></h2>
                <button onclick="showHome()" class="text-gray-600 hover:text-gray-800">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="authForm" class="space-y-4">
                <div>
                    <label id="userIdLabel" class="block text-sm font-medium text-gray-700 mb-2"></label>
                    <input type="text" id="userId" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold transition-all duration-300">
                    Login
                </button>
            </form>
        </div>

        <!-- Student Dashboard -->
        <div id="studentDashboard" class="hidden bg-white/90 backdrop-blur-lg rounded-2xl shadow-xl p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Student Dashboard</h2>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">Logout</button>
            </div>
            <div id="studentResults" class="space-y-4">
                <!-- Student results will be loaded here -->
            </div>

            <!-- AI Recommendations -->
            <div class="mt-8">
                <h3 class="text-lg font-semibold mb-4">📊 Performance Analysis & Recommendations</h3>
                <div id="aiRecommendations" class="bg-purple-50 p-4 rounded-lg">
                    <p class="text-gray-500">Loading recommendations...</p>
                </div>
            </div>
        </div>

        <!-- Teacher Dashboard -->
        <div id="teacherDashboard" class="hidden bg-white/90 backdrop-blur-lg rounded-2xl shadow-xl p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Teacher Dashboard</h2>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">Logout</button>
            </div>

            <!-- Add/Edit Result Form -->
            <div class="bg-gray-50 p-6 rounded-lg mb-6">
                <h3 class="text-lg font-semibold mb-4">Add/Update Student Result</h3>
                <form id="resultForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="studentRollNo" placeholder="Roll Number" required class="px-4 py-2 border rounded-lg">
                    <input type="text" id="studentName" placeholder="Student Name" required class="px-4 py-2 border rounded-lg">
                    <input type="text" id="subject" placeholder="Subject" required class="px-4 py-2 border rounded-lg">
                    <input type="number" id="marks" placeholder="Marks" required class="px-4 py-2 border rounded-lg">
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg col-span-2">Add/Update Result</button>
                </form>
            </div>

            <!-- Add Topic-wise Marks -->
            <div class="bg-gray-50 p-6 rounded-lg mb-6">
                <h3 class="text-lg font-semibold mb-4">Add Topic-wise Marks</h3>
                <form id="topicResultForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="topicRollNo" placeholder="Roll Number" required class="px-4 py-2 border rounded-lg">
                    <input type="text" id="topicSubject" placeholder="Subject" required class="px-4 py-2 border rounded-lg">
                    <input type="text" id="topicName" placeholder="Topic (e.g. Trigonometry)" required class="px-4 py-2 border rounded-lg">
                    <input type="number" id="topicMarks" placeholder="Marks obtained" required class="px-4 py-2 border rounded-lg">
                    <input type="number" id="topicMaxMarks" placeholder="Max marks" required class="px-4 py-2 border rounded-lg">
                    <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg col-span-2">Add Topic Marks</button>
                </form>
            </div>

            <!-- All Students Results -->
            <div id="allResults" class="space-y-4">
                <!-- All results will be loaded here -->
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminDashboard" class="hidden bg-white/90 backdrop-blur-lg rounded-2xl shadow-xl p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Admin Dashboard</h2>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">Logout</button>
            </div>

            <!-- Login Logs -->
            <div class="mb-8">
                <h3 class="text-lg font-semibold mb-4">Login Activity</h3>
                <div id="loginLogs" class="bg-gray-50 p-4 rounded-lg max-h-60 overflow-y-auto">
                    <!-- Login logs will be displayed here -->
                </div>
            </div>

            <!-- All Results View -->
            <div>
                <h3 class="text-lg font-semibold mb-4">All Student Results</h3>
                <div id="adminResults" class="space-y-4">
                    <!-- All results will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
       // frontend/js/main.js

// API Base URL
const API_BASE = 'http://localhost:8000';

let currentUser = null;
let currentRole = null;

// Show different pages
function showHome() {
    hideAll();
    document.getElementById('homePage').classList.remove('hidden');
}

function showLogin(role) {
    hideAll();
    currentRole = role;
    document.getElementById('loginForm').classList.remove('hidden');

    const titles = {
        student: 'Student Login',
        teacher: 'Teacher Login',
        admin: 'Admin Login'
    };

    const labels = {
        student: 'Roll Number',
        teacher: 'Employee ID',
        admin: 'Admin ID'
    };

    document.getElementById('loginTitle').textContent = titles[role];
    document.getElementById('userIdLabel').textContent = labels[role];
}

function hideAll() {
    const pages = ['homePage', 'loginForm', 'studentDashboard', 'teacherDashboard', 'adminDashboard'];
    pages.forEach(page => {
        document.getElementById(page).classList.add('hidden');
    });
}

function logout() {
    currentUser = null;
    currentRole = null;
    showHome();
}

// Authentication
document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const userId = document.getElementById('userId').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch(`${API_BASE}/login`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                user_id: userId,
                password: password,
                role: currentRole
            })
        });

        const data = await response.json();

        if (response.ok) {
            currentUser = data.user;
            showDashboard(currentRole);
            loadData();
        } else {
            alert(data.detail || 'Login failed');
        }
    } catch (error) {
        alert('Login failed. Please check if backend is running on http://localhost:8000');
    }
});

function showDashboard(role) {
    hideAll();
    document.getElementById(`${role}Dashboard`).classList.remove('hidden');
}

// Load data based on role
async function loadData() {
    if (currentRole === 'student') {
        await loadStudentResults();
        await loadRecommendations();
    } else if (currentRole === 'teacher') {
        await loadAllResults();
    } else if (currentRole === 'admin') {
        await loadLoginLogs();
        await loadAllResultsForAdmin();
    }
}

// Student: Load own results
async function loadStudentResults() {
    try {
        console.log('Loading results for student:', currentUser.user_id); // Debug log
        const response = await fetch(`${API_BASE}/results/student/${currentUser.user_id}`);
        const results = await response.json();

        console.log('Student results received:', results); // Debug log

        const container = document.getElementById('studentResults');
        if (!results || results.length === 0) {
            container.innerHTML = '<div class="bg-gray-50 p-4 rounded-lg text-center text-gray-600">No results found for your roll number</div>';
            return;
        }

        container.innerHTML = results.map(result => `
            <div class="bg-gray-50 p-4 rounded-lg">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div><strong>Subject:</strong> ${result.subject}</div>
                    <div><strong>Marks:</strong> ${result.marks}</div>
                    <div><strong>Grade:</strong> ${getGrade(result.marks)}</div>
                    <div><strong>Date:</strong> ${new Date(result.created_at).toLocaleDateString()}</div>
                </div>
            </div>
        `).join('');
    } catch (error) {
        console.error('Error loading student results:', error); // Debug log
        document.getElementById('studentResults').innerHTML = '<p class="text-red-500">Error loading results. Check console for details.</p>';
    }
}

// Student: Load AI-generated performance recommendations
async function loadRecommendations() {
    const container = document.getElementById('aiRecommendations');
    container.innerHTML = '<p class="text-gray-500">Analyzing performance... (first request may take 10-20s)</p>';
    try {
        const response = await fetch(`${API_BASE}/ai/recommendations/${currentUser.user_id}`);
        const data = await response.json();

        let weakAreasHtml = '';
        if (data.weak_areas && data.weak_areas.length > 0) {
            weakAreasHtml = '<div class="mb-3 space-y-2">' + data.weak_areas.map(w => `
                <div class="bg-white p-3 rounded-lg flex justify-between items-center">
                    <span><strong>${w.subject}</strong> — ${w.topic}</span>
                    <span class="text-red-600 font-semibold">${w.score_pct}%</span>
                </div>
            `).join('') + '</div>';
        }

        container.innerHTML = `
            ${weakAreasHtml}
            <div class="bg-white p-4 rounded-lg">
                <p class="text-sm text-gray-500 mb-1">AI Recommendation:</p>
                <p class="text-gray-800">${data.recommendation}</p>
            </div>
        `;
    } catch (error) {
        console.error('Error loading recommendations:', error);
        container.innerHTML = '<p class="text-red-500">Could not load recommendations. Check console for details.</p>';
    }
}

// Teacher: Load all results and handle CRUD
async function loadAllResults() {
    try {
        const response = await fetch(`${API_BASE}/results/all`);
        const results = await response.json();

        const container = document.getElementById('allResults');
        if (results.length === 0) {
            container.innerHTML = '<div class="bg-gray-50 p-4 rounded-lg text-center text-gray-600">No results found</div>';
            return;
        }

        container.innerHTML = results.map(result => `
            <div class="bg-gray-50 p-4 rounded-lg">
                <div class="grid grid-cols-2 md:grid-cols-5 gap-4 items-center">
                    <div><strong>Roll:</strong> ${result.student_roll}</div>
                    <div><strong>Name:</strong> ${result.student_name}</div>
                    <div><strong>Subject:</strong> ${result.subject}</div>
                    <div><strong>Marks:</strong> ${result.marks}</div>
                    <div class="flex gap-2">
                        <button onclick="deleteResult(${result.id})" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Delete</button>
                    </div>
                </div>
            </div>
        `).join('');
    } catch (error) {
        document.getElementById('allResults').innerHTML = '<p class="text-red-500">Error loading results</p>';
    }
}

// Admin: Load login logs
async function loadLoginLogs() {
    try {
        const response = await fetch(`${API_BASE}/admin/login-logs`);
        const logs = await response.json();

        const container = document.getElementById('loginLogs');
        container.innerHTML = logs.map(log => `
            <div class="mb-2 p-2 bg-white rounded">
                <span class="font-semibold">${log.user_id}</span> (${log.role}) -
                <span class="text-gray-600">${new Date(log.login_time).toLocaleString()}</span>
            </div>
        `).join('');
    } catch (error) {
        document.getElementById('loginLogs').innerHTML = '<p class="text-red-500">Error loading logs</p>';
    }
}

// Admin: Load all results (read-only)
async function loadAllResultsForAdmin() {
    try {
        const response = await fetch(`${API_BASE}/results/all`);
        const results = await response.json();

        const container = document.getElementById('adminResults');
        container.innerHTML = results.map(result => `
            <div class="bg-gray-50 p-4 rounded-lg">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div><strong>Roll:</strong> ${result.student_roll}</div>
                    <div><strong>Name:</strong> ${result.student_name}</div>
                    <div><strong>Subject:</strong> ${result.subject}</div>
                    <div><strong>Marks:</strong> ${result.marks}</div>
                </div>
            </div>
        `).join('');
    } catch (error) {
        document.getElementById('adminResults').innerHTML = '<p class="text-red-500">Error loading results</p>';
    }
}

// Teacher: Add/Update result
document.getElementById('resultForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const resultData = {
        student_roll: document.getElementById('studentRollNo').value,
        student_name: document.getElementById('studentName').value,
        subject: document.getElementById('subject').value,
        marks: parseInt(document.getElementById('marks').value)
    };

    try {
        const response = await fetch(`${API_BASE}/results`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(resultData)
        });

        if (response.ok) {
            alert('Result added successfully!');
            e.target.reset();
            loadAllResults();
        } else {
            alert('Error adding result');
        }
    } catch (error) {
        alert('Error adding result');
    }
});

// Teacher: Add topic-wise marks
document.getElementById('topicResultForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
        student_roll: document.getElementById('topicRollNo').value,
        subject: document.getElementById('topicSubject').value,
        topic: document.getElementById('topicName').value,
        marks: parseFloat(document.getElementById('topicMarks').value),
        max_marks: parseFloat(document.getElementById('topicMaxMarks').value)
    };
    try {
        const response = await fetch(`${API_BASE}/topic-results`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (response.ok) {
            alert('Topic marks added!');
            e.target.reset();
        } else {
            alert('Error adding topic marks');
        }
    } catch (error) {
        alert('Error adding topic marks');
    }
});

// Teacher: Delete result
async function deleteResult(resultId) {
    if (confirm('Are you sure you want to delete this result?')) {
        try {
            const response = await fetch(`${API_BASE}/results/${resultId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                alert('Result deleted successfully!');
                loadAllResults();
            } else {
                alert('Error deleting result');
            }
        } catch (error) {
            alert('Error deleting result');
        }
    }
}

// Utility function to get grade
function getGrade(marks) {
    if (marks >= 90) return 'A+';
    if (marks >= 80) return 'A';
    if (marks >= 70) return 'B+';
    if (marks >= 60) return 'B';
    if (marks >= 50) return 'C';
    return 'F';
}

// Initialize app
showHome();
    </script>
</body>
</html>
